vendor: openweathermap
base_url: https://api.openweathermap.org
package: weather_sdk
client_name: WeatherApi

operations:
  current_weather:
    path: /data/2.5/weather
    method_name: get_current_weather
    model: CurrentWeatherResponse
    summary: Fetch the current weather observation for one location.
    docs_url: https://openweathermap.org/api/current?collection=current_forecast
    shape: single
    cost: 1
    not_found: empty

    # Spitzeisen currently consumes JSON only, so the vendor's XML/HTML `mode` switch is not a
    # supported SDK argument. `appid` is represented by the OpenAPI security scheme and supplied
    # at runtime by AsyncSpitzeisenConfig.auth rather than appearing in the method signature.
    exclude_params: [mode]
    params:
      lat:
        name: latitude
        coercion_style: date
      lon:
        name: longitude
        coercion_style: comma_list
      lang:
        name: language
        coercion_style: comma_choice_list
        literal: Test
      units:
        name: unittt
        client_default: "'test'"
