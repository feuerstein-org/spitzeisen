# These tasks should only be used by GH actions
# The idea is that we don't clutter mise's autocomplete

[tools]
python = "3.14"
uv = "latest"

[tasks.install-ci]
description = "Install dependencies for CI"
run = "uv sync --all-extras --dev"

[tasks.lint-ci]
description = "Show all issues detected by linter (CI only)"
run = [
    "uv run ruff check . --output-format=github",
    "uv run ruff format . --check --diff",
]

[tasks.check-sync-ci]
description = "Fail if the committed _sync tree is stale (CI only)"
run = "uv run python build_sync.py --check"

[tasks.check-codegen-ci]
description = "Fail if the generated example SDK is stale (CI only)"
run = "uv run spitzeisen-gen check --path examples/spec/vendor.json --config examples/spec/manifest.yaml --output-path examples/weather_sdk"

[tasks.pre-commit-ci]
description = "Run pre-commit hooks (CI only)"
run = "uv run pre-commit run --all-files"

[tasks.test-ci]
description = "Run tests (CI only)"
run = [
    "uv run coverage run -m pytest",
    "uv run coverage report --fail-under=80"
]
