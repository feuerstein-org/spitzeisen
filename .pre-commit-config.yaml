default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]

      - id: pyupgrade
        name: pyupgrade
        entry: uv run pyupgrade
        language: system
        types: [python]
        args: ["--py312-plus"]

      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check
        language: system
        types: [python]
        args: [--fix]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
      - id: check-added-large-files
