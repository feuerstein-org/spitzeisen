[project]
name = "spitzeisen"
version = "0.1.0"
description = "An async/sync client framework to generate SDKs for REST APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "dodofarm", email = "ea01052002@gmail.com" }]
keywords = ["api", "client", "rest", "rate-limiting", "openapi", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.7.0",
    "pydantic>=2.11.7",
    "steindamm>=0.8.0",
    "structlog>=25.1.0",
    "typing-extensions>=4.13.0",
]

[project.optional-dependencies]
# Build-time code generation (spitzeisen-gen). Never needed at runtime.
codegen = [
    "jinja2>=3.1.0",
    "ruff>=0.14",
    "datamodel-code-generator>=0.28",
    "httpx>=0.23.1,<0.29",
    "ruamel.yaml>=0.18.6,<0.20",
    "typer>0.16,<0.28",
]

[project.scripts]
spitzeisen-gen = "spitzeisen.codegen.cli:main"

[project.urls]
Homepage = "https://github.com/feuerstein-org/spitzeisen"
Repository = "https://github.com/feuerstein-org/spitzeisen"

[dependency-groups]
dev = [
    "pre-commit",
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-randomly",
    "pyright[nodejs]",
    "ruff>=0.14.14",
    "unasync>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/**", "src/spitzeisen/codegen/smithy/*.java", "src/spitzeisen/codegen/smithy/*.smithy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = ["src/spitzeisen/_sync/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover',
    "if __name__ == '__main__':",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "smithy-spike",
]
lint.select = ["ALL"]
lint.ignore = [
    "ANN401",   # Disallow typing.Any
    "ANN204",   # Require return type annotation for magic methods
    "ASYNC109", # Disallow a `timeout` param on async functions - the transport takes one
                # deliberately, because it forwards it to httpx2 rather than implementing the timeout itself
    "COM812",   # Require trailing commas - conflicts with ruff formatter
    "CPY001",   # Require a copyright notice at the top of every file
    "D105",     # Require docstrings in magic methods
    "D200",     # Require one-line docstrings to fit on one line
    "D203",     # Require 1 blank line before class docstring
    "D212",     # Require multi-line docstring summary to start at the first line
    "D400",     # Require first line of docstring to end with a period
    "D401",     # Require first line of docstring to be in imperative mood
    "D415",     # Require first line of docstring to end with punctuation
    "FBT001",   # Disallow boolean positional arguments
    "FBT002",   # Disallow boolean default values in function definitions
    "FIX002",   # Require TODO comments to contain issue links
    "PGH003",   # Disallow blanket type: ignore comments
    "TC002",    # Require third-party imports only used for type annotations to be in TYPE_CHECKING blocks
    "TC003",    # Require standard imports only used for type annotations to be in TYPE_CHECKING blocks
    "TD002",    # Require author in TODO comments
    "TD003",    # Require issue link in TODO comments
    "TRY003",   # Disallow long exception messages outside exception class
    "TRY400"    # Require logging.exception instead of logging.error in exception handlers
    ]
lint.unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG002",   # Disallow unused method arguments: tests define protocol implementations too
    "DTZ001",   # Require tzinfo in datetime constructors
    "INP001",   # Require packages to have a __init__.py file
    "PLR2004",  # Disallow magic values
    "PLR0913",  # Disallow too many arguments
    "S101",     # Disallow use of assert
    "SLF001",   # Disallow accessing private members
    "S311",     # Disallow usage of pseudo-random generators
    ]
# Generated by unasync from src/spitzeisen/_async - never edited by hand.
"src/spitzeisen/_sync/*" = [ "D", "A", "ARG", "PLR0913", "C416", ]
# Strategy implementations satisfy a protocol, so they accept arguments a given
# implementation has no use for.
"src/spitzeisen/auth.py" = ["ARG002"]
"src/spitzeisen/pagination.py" = ["ARG002"]
"src/spitzeisen/limits.py" = ["ARG002"]
"src/spitzeisen/codegen/cli.py" = [
    "B008",    # Typer declares options in command function defaults
    "FBT003",  # Typer's Option API takes boolean defaults positionally
]
"examples/*" = [
    "INP001",   # Require packages to have a __init__.py file
    "T201",     # Disallow print
]
# datamodel-code-generator owns these classes, which intentionally omit project docstrings.
"examples/weather_sdk/models/_generated.py" = ["D"]

[tool.ruff.lint.pylint]
max-args = 11   # Max arguments for functions - default 5

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
include = ["src", "tests", "examples", "build_sync.py"]
extraPaths = ["examples"]
exclude = ["smithy-spike"]
ignore = [
    "smithy-spike/generated",
]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
enableExperimentalFeatures = true
# unasync ships no stubs, and it is a build-time tool, not part of the shipped package.
reportMissingTypeStubs = false

executionEnvironments = [
    { root = "tests", reportPrivateUsage = false },
    { root = "build_sync.py", reportUnknownMemberType = false }
]
